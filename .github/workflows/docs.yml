name: Public privacy documentation
on:
  push:
    branches: [main]
    paths:
      - 'resources/privacy.json'
      - 'resources/privacy.en.json'
      - 'resources/website.json'
      - 'scripts/generate-docs.cjs'
      - 'scripts/homepage.cjs'
      - 'scripts/site-config.cjs'
      - 'scripts/store-portal-guide.cjs'
      - 'scripts/store-config.cjs'
      - 'package.json'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-docs.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Wait for uploaded Pages artifact metadata
        uses: actions/github-script@v8
        timeout-minutes: 2
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        with:
          retries: 2
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: context.runId, per_page: 100
              });
              const uploaded = artifacts.find(artifact =>
                artifact.name === process.env.PAGES_ARTIFACT_NAME &&
                String(artifact.id) === process.env.PAGES_ARTIFACT_ID && !artifact.expired);
              if (uploaded) return;
              core.info('Waiting for the uploaded Pages artifact to become visible.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Uploaded Pages artifact metadata did not become visible within 60 seconds.');
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
