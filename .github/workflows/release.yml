name: Windows Release
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        type: boolean
        description: Publish this version after verification (otherwise build artifacts only)
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
      verified: ${{ steps.plan.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/github-script@v7
        id: plan
        with:
          script: await require('./scripts/release-plan.cjs')({github, context, core})
  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    env:
      MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version" }
      - name: Restore public Electron and installer tool downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: windows-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: windows-tools-${{ runner.os }}-
      - name: Restore checked renderer build cache
        uses: actions/cache@v4
        with:
          path: |
            .build-cache/renderer.json
            .build-cache/typescript.tsbuildinfo
            .build-cache/assets.json
            dist
          key: renderer-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('src/**', 'public/**', 'index.html', 'vite.config.*', 'tsconfig.json', 'package*.json', 'electron/platform-info.json', 'resources/privacy.json', 'scripts/build*.cjs', 'scripts/generate-assets.ps1', '.env.example') }}
          restore-keys: renderer-${{ runner.os }}-
      - run: npm ci
      - name: Fetch verified AI adapters for integration tests
        if: needs.plan.outputs.verified != 'true'
        run: node scripts/fetch-ai-test-components.cjs
      - run: npm test
        if: needs.plan.outputs.verified != 'true'
      - run: npm run build
      - run: npm run test:desktop:built
        if: needs.plan.outputs.verified != 'true'
      - run: npm run docs
      - run: npm run docs:check
      - run: npm run dist:all:built
      - run: npm run verify:msix
      - name: Test installed MSIX in disposable runner
        shell: pwsh
        run: ./scripts/test-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          if-no-files-found: error
          path: |
            release/*.msix
            release/store-package.json
      - name: Publish installers and checksums
        if: needs.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          $packages = @(Get-ChildItem release/*Setup.exe) + @(Get-ChildItem release/*.msix)
          if ($packages.Count -lt 2) { throw "Windows packages missing" }
          $checksums = $packages | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $checksums | Set-Content release/SHA256SUMS.txt
          gh release create "$env:RELEASE_TAG" $packages.FullName release/SHA256SUMS.txt release/store-package.json docs/store-portal-fields.json --target "$env:RELEASE_SHA" --title "Streamer Assist $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
      - name: Store readiness summary
        shell: pwsh
        env:
          STORE_ENABLED: ${{ vars.STORE_PUBLISH_ENABLED }}
        run: |
          if ($env:STORE_ENABLED -ne 'true') { 'Store automatic submission is not enabled. MSIX artifacts are available in this workflow.' | Out-File $env:GITHUB_STEP_SUMMARY -Append }
  store:
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true' && vars.STORE_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    concurrency:
      group: microsoft-store-submission
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: store-package
          path: release
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        with:
          version: v0.4.3
      - name: Verify Store CLI runtime
        shell: pwsh
        run: |
          dotnet --list-runtimes
          msstore --version
          if ($LASTEXITCODE -ne 0) { throw 'Store CLI runtime setup failed.' }
      - name: Verify Store access and first publication
        shell: pwsh
        run: ./scripts/check-store-access.ps1 -RequirePublished
      - name: Submit MSIX update
        shell: pwsh
        run: ./scripts/publish-store.ps1
      - name: Inspect actual Store publication status
        if: always()
        shell: pwsh
        run: ./scripts/inspect-store-submission.ps1 -FailOnError
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-publication-report
          if-no-files-found: ignore
          path: |
            release/store-access.json
            release/store-submission-report.json
