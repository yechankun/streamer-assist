name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Store draft guards and public settings backup
        shell: pwsh
        run: |
          ./tests/store-draft-backup.ps1
          ./tests/store-submission.ps1
      - run: npm run test:desktop
      - run: npm run docs
      - name: Build Windows EXE and MSIX
        run: npm run dist:all
      - run: npm run verify:msix
      - name: Test installed MSIX in disposable runner
        shell: pwsh
        run: ./scripts/test-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            release/*Setup.exe
            release/*.msix
            release/store-package.json
            release/msix-runtime.png
