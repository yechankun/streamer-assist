name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run docs
      - name: Build Windows EXE and MSIX
        run: npm run dist:all
      - run: npm run verify:msix
      - name: Test installed MSIX in disposable runner
        shell: pwsh
        run: ./scripts/test-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            release/*Setup.exe
            release/*.msix
            release/store-package.json
            release/msix-runtime.png
