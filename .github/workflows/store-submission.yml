name: Store Submission
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: Inspect, prepare, submit, or explicitly replace an empty first draft
        options:
          [
            inspect,
            create,
            prepare,
            upload-package,
            upload-backup,
            submit,
            recreate-submit,
            recreate-prepare,
            create-submit,
            resume-submit,
            retry-name-failure,
          ]
        default: inspect
      package_run_id:
        type: string
        description: Verified Windows Release package build with store-package artifact
        default: "37561152697"
      settings_backup_run_id:
        type: string
        description: Store Submission run holding the original public draft settings
        default: "37415766802"
permissions:
  contents: read
  actions: read
concurrency:
  group: microsoft-store-submission
  cancel-in-progress: false
jobs:
  submission:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      SETTINGS_BACKUP_RUN_ID: ${{ inputs.settings_backup_run_id }}
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify draft guards and public settings backup
        shell: pwsh
        run: |
          ./tests/store-draft-backup.ps1
          ./tests/store-submission.ps1
          ./tests/store-package-upload.ps1
      - name: Verify package source
        if: inputs.action == 'recreate-prepare' || inputs.action == 'upload-backup' || inputs.action == 'upload-package' || inputs.action == 'prepare' || inputs.action == 'submit' || inputs.action == 'recreate-submit' || inputs.action == 'create-submit' || inputs.action == 'resume-submit' || inputs.action == 'retry-name-failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PACKAGE_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid package run ID.' }
          $endpoint = 'repos/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:PACKAGE_RUN_ID
          $runInfo = gh api $endpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Package build lookup failed.' }
          $trustedSource = ($runInfo.event -in @('workflow_dispatch','workflow_run') -and $runInfo.head_branch -eq 'main') -or ($runInfo.event -eq 'push' -and $runInfo.head_branch -match '^v[0-9]+\.[0-9]+\.[0-9]+$')
          if ($runInfo.name -ne 'Windows Release' -or !$trustedSource -or $runInfo.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Use a verified Windows Release build from this repository.' }
          $jobInfo = gh api ($endpoint + '/jobs') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobInfo.jobs | Where-Object { $_.name -eq 'release' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'The package verification job must have succeeded; a Store job failure does not invalidate a verified package.' }
      - uses: actions/download-artifact@v4
        if: inputs.action == 'recreate-prepare' || inputs.action == 'upload-backup' || inputs.action == 'upload-package' || inputs.action == 'prepare' || inputs.action == 'submit' || inputs.action == 'recreate-submit' || inputs.action == 'create-submit' || inputs.action == 'resume-submit' || inputs.action == 'retry-name-failure'
        with:
          name: store-package
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify public settings backup source
        if: inputs.action == 'create-submit' || inputs.action == 'resume-submit' || inputs.action == 'retry-name-failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:SETTINGS_BACKUP_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid settings backup run ID.' }
          $endpoint = 'repos/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:SETTINGS_BACKUP_RUN_ID
          $runInfo = gh api $endpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $runInfo.name -ne 'Store Submission' -or $runInfo.event -ne 'workflow_dispatch' -or $runInfo.head_branch -ne 'main' -or $runInfo.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Use this repository first-draft public settings backup.' }
      - uses: actions/download-artifact@v4
        if: inputs.action == 'create-submit' || inputs.action == 'resume-submit' || inputs.action == 'retry-name-failure'
        with:
          name: store-draft-settings-backup
          run-id: ${{ inputs.settings_backup_run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Create first API draft and submit
        if: inputs.action == 'create-submit'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1 -CreateNewDraft -Commit
      - name: Resume first API draft and submit
        if: inputs.action == 'resume-submit'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1 -RestorePublicSettings -Commit
      - name: Replace owned name-failure API draft and submit
        if: inputs.action == 'retry-name-failure'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1 -RestorePublicSettings -ReplaceNameFailureDraft -Commit
      - name: Back up approved empty draft
        if: inputs.action == 'recreate-submit' || inputs.action == 'recreate-prepare'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1 -RecreateEmptyDraft -BackupOnly
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'recreate-submit' || inputs.action == 'recreate-prepare'
        with:
          name: store-draft-settings-backup
          if-no-files-found: error
          retention-days: 90
          path: release/store-draft-backup.json
      - name: Recreate approved empty draft and submit
        if: inputs.action == 'recreate-submit'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1 -RecreateEmptyDraft -Commit
      - name: Recreate approved empty first draft and prepare without commit
        if: inputs.action == 'recreate-prepare'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1 -RecreateEmptyDraft
      - name: Inspect existing submission
        if: inputs.action == 'inspect'
        shell: pwsh
        run: ./scripts/inspect-store-submission.ps1 -FailOnError
      - name: Create API draft without deleting an existing draft
        if: inputs.action == 'create'
        shell: pwsh
        run: ./scripts/inspect-store-submission.ps1 -CreateApiDraft
      - name: Prepare existing draft
        if: inputs.action == 'prepare'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1
      - name: Upload package only and preserve draft settings
        if: inputs.action == 'upload-package'
        shell: pwsh
        run: ./scripts/upload-store-package.ps1
      - name: Back up public settings without changing the draft
        if: inputs.action == 'upload-backup'
        shell: pwsh
        run: ./scripts/upload-store-package.ps1 -BackupOnly
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'upload-backup'
        with:
          name: store-draft-settings-backup
          if-no-files-found: error
          retention-days: 90
          path: release/store-draft-backup.json
      - name: Inspect package after upload
        if: always() && inputs.action == 'upload-package'
        shell: pwsh
        run: ./scripts/inspect-store-submission.ps1
      - name: Submit existing draft
        if: inputs.action == 'submit'
        shell: pwsh
        run: ./scripts/prepare-store-submission.ps1 -Commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-submission-report
          if-no-files-found: ignore
          path: |
            release/store-submission-report.json
            release/store-submission-action.json
            release/store-submission-creation.json
